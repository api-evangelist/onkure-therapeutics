aid: onkure-therapeutics
name: OnKure Therapeutics
description: 'OnKure Therapeutics (Nasdaq: OKUR) is a publicly traded, clinical-stage biopharmaceutical
  company headquartered in Boulder, Colorado, developing precision medicines for people with cancer. The
  company designs mutant-selective small-molecule inhibitors against oncogenic drivers in the PI3K pathway;
  its lead program OKI-219 is a selective PI3K-alpha H1047R inhibitor in clinical development, with additional
  discovery programs targeting further PI3K-alpha mutations. OnKure became publicly listed through its
  2024 combination with Reneo Pharmaceuticals. It is a therapeutics developer rather than a software vendor:
  it operates a corporate and investor relations web presence and publishes no developer program, public
  API, SDK, or machine-readable API contract.'
